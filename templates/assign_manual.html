<!DOCTYPE html>
<html>
<head>
    <title>Therapy Auto-fill</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body>

<h2>Select Therapy</h2>

<select id="therapy_select" style="width: 300px;">
    <option value="">Search Therapy...</option>
    {% for therapy in therapies %}
        <option value="{{ therapy.id }}">{{ therapy.name }}</option>
    {% endfor %}
</select>

<div style="margin-top:20px">
    <p><strong>Therapy Code:</strong> <span id="code"></span></p>
    <p><strong>Group:</strong> <span id="group"></span></p>
    <p><strong>Category:</strong> <span id="category"></span></p>
    <p><strong>Duration:</strong> <span id="duration"></span></p>
    <p><strong>Bathing Required:</strong> <span id="bathing"></span></p>
    <p><strong>Treatment Room Required:</strong> <span id="treatment"></span></p>
    <p><strong>Cost:</strong> ₹<span id="cost"></span></p>
    <p><strong>Super Senior Needed:</strong> <span id="ss"></span></p>
    <p><strong>Senior Needed:</strong> <span id="s"></span></p>
    <p><strong>Junior Needed:</strong> <span id="j"></span></p>
    <p><strong>Trainee Needed:</strong> <span id="t"></span></p>
    <p><strong>Total Therapist Needed:</strong> <span id="total"></span></p>
</div>

<script>
    $('#therapy_select').select2();

    $('#therapy_select').on('change', function () {
        const id = $(this).val();
        if (id) {
            $.get('/get-therapy-details/' + id + '/', function (data) {
                $('#code').text(data.code);
                $('#group').text(data.group);
                $('#category').text(data.category);
                $('#duration').text(data.duration);
                $('#bathing').text(data.bathing_required ? "Yes" : "No");
                $('#treatment').text(data.treatment_room_required ? "Yes" : "No");
                $('#cost').text(data.cost);
                $('#ss').text(data.super_senior_needed);
                $('#s').text(data.senior_needed);
                $('#j').text(data.junior_needed);
                $('#t').text(data.trainee_needed);
                $('#total').text(data.total_therapist_needed);
            });
        }
    });
</script>

</body>
</html>
