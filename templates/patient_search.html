{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Find Patient</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    .search-box { max-width: 800px; margin: 40px auto; }
  </style>
</head>
<body>
<div class="container">
  <div class="search-box">
    <h3>Search patient to view schedule</h3>
    <p>Type name, registration number or unique ID and select from the dropdown.</p>

    <select id="patient-search" style="width:100%"></select>

    <div class="mt-3">
      <a href="{% url 'patient_lookup' %}" class="btn btn-link">Or go to patient lookup</a>
    </div>
  </div>
</div>

<script>
$(function(){
  const $sel = $('#patient-search');
  $sel.select2({
    placeholder: 'Search patient by name / reg no / unique id',
    minimumInputLength: 2,
    ajax: {
      url: "{% url 'api_search_patients' %}",
      dataType: 'json',
      delay: 250,
      data: function(params){
        return { q: params.term };
      },
      processResults: function (data) {
        // Select2 expects { results: [ {id, text}, ... ] }
        return data;
      }
    }
  });

  $sel.on('select2:select', function(e){
    const data = e.params.data;
    // 'id' is what the API returned (we used pat_reg_no by default).
    const patientId = data.id;

    // redirect to patient schedule page
    // if your patient_schedule takes pat_reg_no, use that; otherwise, use id as needed.
    const url = "{% url 'patient_schedule' 0 %}".replace('/0/', '/' + encodeURIComponent(patientId) + '/');
    window.location.href = url;
  });
});
</script>
</body>
</html>
