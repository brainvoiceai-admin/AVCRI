{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVCRI - Login</title>
    
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <!-- Navbar -->
<nav class="navbar" style="display: flex; justify-content: space-between; align-items: center;">
    
    <!-- Logo on Left -->
    <a href="/" class="logo">
        <img src="{% static 'images/WhatsApp Image 2025-07-28 at 10.52.24 AM.jpeg' %}" 
             alt="AVCRI Logo" 
             style="height:50px; width:auto;">
    </a>

    <!-- Home on Right -->
    <a href="/" 
       style="padding: 8px 16px; text-decoration: none; color: #000; border-radius: 6px;
              transition: all 0.3s ease;"
       onmouseover="this.style.color='#2ed573'; this.style.background='rgba(46,213,115,0.1)';"
       onmouseout="this.style.color='#000'; this.style.background='transparent';">
        Home
    </a>
</nav>

          

    <!-- Main Container -->
    <div class="main-container">
        <div class="login-container">
            <div class="form-header">
                <h1>Welcome to AVCRI</h1>
                <p>Login to continue</p>
            </div>

            <form id="loginForm" method="POST" action="{% url 'authentication:login' %}">
                {% csrf_token %}
                <div id="messageContainer">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="message error">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                </div>
                
            <div class="form-group">
    <label for="username">Username</label>
    <div class="username-input">
        <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username"
            required
        >
    </div>
</div>


                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    <span id="btnText">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
          <footer style="text-align:center; font-size:14px; color:#555;">
    Powered by <strong>BrainVoice.AI</strong>
    </footer>

    

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
