{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Role - AVCRI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:Arial,sans-serif;background-color:#f8f9fa}
    .sidebar{background-color:#343a40;color:#fff;min-height:100vh;position:fixed;width:18%}
    .sidebar a{color:#adb5bd;padding:10px 15px;display:block;text-decoration:none}
    .sidebar a:hover{color:#fff;background-color:#495057}
    .main{padding:20px;margin-left:18%;width:calc(100% - 18%);max-width:calc(100vw - 18%);overflow-x:auto}
    @media (max-width:768px){.sidebar{position:static;width:100%}.main{margin-left:0;padding:10px}}
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div class="sidebar p-0">{% include 'dashboards/nav.html' %}</div>
      <div class="main">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2>Edit Role</h2>
          <a class="btn btn-secondary" href="{% url 'authentication:role_management' %}">Back to Roles</a>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}

        <div class="card">
          <div class="card-header"><strong>Role Details</strong></div>
          <div class="card-body">
            <form method="post" action="{% url 'authentication:edit_role' role.id %}">
              {% csrf_token %}
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">System Name</label>
                  <input type="text" name="name" class="form-control" value="{{ role.name }}" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Display Name</label>
                  <input type="text" name="display_name" class="form-control" value="{{ role.display_name }}" required />
                </div>
                <div class="col-md-4 form-check align-self-end">
                  <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if role.is_active %}checked{% endif %}>
                  <label class="form-check-label" for="is_active">Active</label>
                </div>
                <div class="col-12">
                  <label class="form-label">Description</label>
                  <textarea name="description" rows="2" class="form-control">{{ role.description }}</textarea>
                </div>
              </div>

              <hr/>
              <h5>Modules</h5>
              <div class="row row-cols-1 row-cols-md-3 g-2">
                {% for m in modules %}
                <div class="col">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="modules" id="module_{{ m.id }}" value="{{ m.id }}" {% if m in role.modules.all %}checked{% endif %}>
                    <label class="form-check-label" for="module_{{ m.id }}">{{ m.display_name }} <small class="text-muted">({{ m.url_name }})</small></label>
                  </div>
                </div>
                {% empty %}
                <div class="col"><span class="text-muted">No modules available.</span></div>
                {% endfor %}
              </div>

              <div class="mt-3">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-outline-secondary" href="{% url 'authentication:role_management' %}">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
