<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .sidebar {
      background-color: #198754; /* Green color */
      color: white;
      min-height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      z-index: 1000;
      padding-top: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .main {
      margin-left: 270px;
      padding: 20px;
      width: calc(100% - 250px);
    }
    .card {
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      border: none;
    }
    .table th {
      white-space: nowrap;
      background-color: #198754;
      color: white;
    }
    .table td {
      vertical-align: middle;
    }
    .btn-sm {
      margin: 2px;
    }
    .badge {
      font-size: 0.85em;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: static;
        width: 100%;
        min-height: auto;
      }
      .main {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
{% include 'dashboards/nav.html' %}

      <!-- Main Content -->
      <div class="col-md-9 col-lg-10 main">
        <h2 class="mb-4">User Management Dashboard</h2>

        <!-- Filters & Search -->
        <div class="row mb-3 g-3">
          <div class="col-md-4">
            <label for="roleFilter" class="form-label">Filter by Role</label>
            <select id="roleFilter" class="form-select">
              <option value="">-- All Roles --</option>
              <option value="Super Admin">Super Admin (IT Department)</option>
              <option value="Admin">Admin (GM / Management)</option>
              <option value="Doctor">Doctor</option>
              <option value="Scheduling Staff">Scheduling Staff</option>
              <option value="Therapist">Therapist</option>
              <option value="Nurse">Nurse</option>
              <option value="Patient">Patient</option>
              <option value="IP Pharmacy Staff">IP Pharmacy Staff</option>
              <option value="IMU Staff">IMU Staff (Instant Medical Unit)</option>
              <option value="Finance Staff">Finance Staff</option>
              <option value="HR">HR</option>
              <option value="Housekeeping Staff">Housekeeping Staff</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="searchBox" class="form-label">Search</label>
            <input type="text" id="searchBox" class="form-control" placeholder="Search by name or email">
          </div>
        </div>

        <!-- User Table -->
        <div class="card mt-3">
          <div class="card-header d-flex justify-content-between align-items-center bg-success text-white">
            <span>Manage Users</span>
            <button class="btn btn-sm btn-light">+ Add User</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-bordered table-striped mb-0" id="userTable">
                <thead>
                  <tr>
                    <th>User Name</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr data-role="Doctor">
                    <td>DOC001</td>
                    <td>Dr. John Doe</td>
                    <td>john.doe@example.com</td>
                    <td>Doctor</td>
                    <td><span class="badge bg-success">Active</span></td>
                    <td>
                      <button class="btn btn-sm btn-warning">Edit</button>
                      <button class="btn btn-sm btn-danger">Delete</button>
                      <button class="btn btn-sm btn-secondary">Disable</button>
                    </td>
                  </tr>
                  <tr data-role="Doctor">
                    <td>DOC002</td>
                    <td>Dr. Mary Smith</td>
                    <td>mary.smith@example.com</td>
                    <td>Doctor</td>
                    <td><span class="badge bg-secondary">Inactive</span></td>
                    <td>
                      <button class="btn btn-sm btn-warning">Edit</button>
                      <button class="btn btn-sm btn-danger">Delete</button>
                      <button class="btn btn-sm btn-secondary">Disable</button>
                    </td>
                  </tr>
                  <!-- More rows here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filtering Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const roleFilter = document.getElementById("roleFilter");
      const searchBox = document.getElementById("searchBox");
      const rows = document.querySelectorAll("#userTable tbody tr");

      function filterTable() {
        const role = roleFilter.value.toLowerCase();
        const search = searchBox.value.toLowerCase();

        rows.forEach(row => {
          const rowRole = row.getAttribute("data-role").toLowerCase();
          const text = row.innerText.toLowerCase();
          row.style.display = ((role === "" || rowRole === role) && text.includes(search)) ? "" : "none";
        });
      }

      roleFilter.addEventListener("change", filterTable);
      searchBox.addEventListener("input", filterTable);
    });
  </script>
</body>
</html>
