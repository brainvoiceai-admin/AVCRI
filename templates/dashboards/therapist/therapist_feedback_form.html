<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Feedback System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Rich Text Editor CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --light: #f8f9fa;
            --dark: #343a40;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            line-height: 1.6;
        }
        
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px 0;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            position: fixed;
            height: 100%;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .nav-links {
            padding: 20px 0;
        }
        
        .nav-item {
            padding: 12px 25px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid white;
        }
        
        .nav-item i {
            margin-right: 15px;
            font-size: 1.2rem;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: var(--dark);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #6c757d;
            font-size: 1.1rem;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }
        
        /* Card Styles */
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border: none;
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-body {
            padding: 20px;
        }
        
        /* Form Styles */
        .form-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        
        .form-title {
            color: var(--dark);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f1f1;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* Rich Text Editor */
        .editor-container {
            height: 300px;
            margin-bottom: 20px;
        }
        
        /* Completion Section */
        .completion-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid var(--success);
        }
        
        .completion-check {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .completion-check input {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                width: 220px;
            }
            
            .main-content {
                margin-left: 220px;
            }
        }
        
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
         {% include 'dashboards/nav.html' %}
        

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div>
                    <h1>Patient Feedback Entry</h1>
                    <p>Record and submit feedback for therapy sessions</p>
                </div>
                <div class="user-info">
                    <img src="https://ui-avatars.com/api/?name=Dr+Sarah&background=667eea&color=fff" alt="Therapist">
                    <div>
                        <strong>Dr. Sarah Johnson</strong>
                        <div>Therapist</div>
                    </div>
                </div>
            </div>

            <!-- Patient Information -->
            <div class="card">
                <div class="card-header">
                    <span>Patient Information</span>
                </div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="patientSelect">Select Patient</label>
                            <select id="patientSelect" class="form-control">
                                <option value="">-- Select Patient --</option>
                                <option value="PAT001" selected>PAT001 - John Doe</option>
                                <option value="PAT002">PAT002 - Mary Smith</option>
                                <option value="PAT003">PAT003 - Robert Johnson</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="therapyType">Therapy Type</label>
                            <select id="therapyType" class="form-control">
                                <option value="">-- Select Therapy --</option>
                                <option value="physical" selected>Physical Therapy</option>
                                <option value="hydro">Hydrotherapy</option>
                                <option value="occupational">Occupational Therapy</option>
                                <option value="speech">Speech Therapy</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sessionDate">Session Date</label>
                            <input type="date" id="sessionDate" class="form-control" value="2023-10-15">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Feedback Form -->
            <div class="form-container">
                <h2 class="form-title">Session Feedback</h2>
                
              
                
                <div class="form-group">
                    <label>Detailed Feedback</label>
                    <div id="editor-container" class="editor-container">
                        <!-- Rich text editor will be initialized here -->
                    </div>
                </div>
                
                
                <div class="d-flex justify-content-end mt-4">
                    <button type="button" class="btn btn-secondary me-2">Save Draft</button>
                    <button type="button" class="btn btn-success" id="submitFeedback">Mark as complet & Submit Feedback</button>
                </div>
            </div>
            
           
          
        </div>
    </div>

    <!-- Rich Text Editor JS -->
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <script>
        // Initialize Quill editor
        var quill = new Quill('#editor-container', {
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image', 'video'],
                    ['clean']
                ]
            },
            placeholder: 'Enter detailed feedback about the therapy session...',
            theme: 'snow'
        });
        
        // Set some default content
        quill.root.innerHTML = '<p>Patient demonstrated improved mobility during today\'s session. They were able to complete 3 sets of stretching exercises with minimal discomfort.</p><p><br></p><p>Recommendations for next session:</p><ul><li>Increase resistance slightly during strength exercises</li><li>Focus on balance exercises for 10 minutes</li><li>Apply heat therapy before session to reduce stiffness</li></ul>';
        
        // Update rating value display
        const ratingSlider = document.getElementById('progressRating');
        const ratingValue = document.getElementById('ratingValue');
        
        ratingSlider.addEventListener('input', function() {
            ratingValue.textContent = this.value;
        });
        
        // Handle form submission
        document.getElementById('submitFeedback').addEventListener('click', function() {
            const isComplete = document.getElementById('markComplete').checked;
            const patient = document.getElementById('patientSelect').value;
            const title = document.getElementById('feedbackTitle').value;
            
            if (!patient) {
                alert('Please select a patient first.');
                return;
            }
            
            if (!title) {
                alert('Please enter a title for your feedback.');
                return;
            }
            
            if (isComplete) {
                alert('Feedback submitted successfully and marked as complete!');
                // In a real application, this would submit to a server
            } else {
                alert('Feedback saved as draft. Remember to mark as complete before final submission.');
                // In a real application, this would save as draft
            }
        });
    </script>
</body>
</html>
