<!doctype html>
{%load static%}
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IP Registration</title>
  
    <link rel="stylesheet" href="{% static 'css/IP_Registration.css' %}">
</head>
<body>
  <h2>IP Registration Form</h2>
  <form>
    <label>pat_reg_no</label><input type="text" name="pat_reg_no">
    <label>pat_prefix</label><input type="text" name="pat_prefix">
    <label>pat_name</label><input type="text" name="pat_name">
    <label>doctcode</label><input type="text" name="doctcode">
    <label>pat_dob</label><input type="date" name="pat_dob">
    <label>pat_age</label><input type="number" name="pat_age">
    <label>pat_sex</label><input type="text" name="pat_sex">
    <label>pat_marital_status</label><input type="text" name="pat_marital_status">
    <label>pat_occup</label><input type="text" name="pat_occup">
    <label>pat_add1</label><input type="text" name="pat_add1">
    <label>pat_add2</label><input type="text" name="pat_add2">
    <label>pat_add3</label><input type="text" name="pat_add3">
    <label>pat_add4</label><input type="text" name="pat_add4">
    <label>pat_add5</label><input type="text" name="pat_add5">
    <label>pat_add6</label><input type="text" name="pat_add6">
    <label>pat_ph_no</label><input type="text" name="pat_ph_no">
    <label>pat_email</label><input type="email" name="pat_email">
    <label>pat_passport</label><input type="text" name="pat_passport">
    <label>pat_reg_date</label><input type="date" name="pat_reg_date">
    <label>pat_visit_date</label><input type="date" name="pat_visit_date">
    <label>pat_room_no</label><input type="text" name="pat_room_no">
    <label>pat_room_date</label><input type="date" name="pat_room_date">
    <label>pat_status</label><input type="text" name="pat_status">
    <label>pat_user</label><input type="text" name="pat_user">
    <label>pat_user_date</label><input type="date" name="pat_user_date">
    <label>dct_team</label><input type="text" name="dct_team">
    <label>aadharno1</label><input type="text" name="aadharno1">
    <label>aadharno2</label><input type="text" name="aadharno2">
    <label>aadharno3</label><input type="text" name="aadharno3">
    <label>pat_op_reg_no</label><input type="text" name="pat_op_reg_no">
    <label>imgloc</label><input type="file" name="imgloc">
    <label>pat_bgroup</label><input type="text" name="pat_bgroup">
    <label>e_contact_name</label><input type="text" name="e_contact_name">
    <label>pat_ref_id</label><input type="text" name="pat_ref_id">
    <label>e_contact_no</label><input type="text" name="e_contact_no">
    <div class="full"><button type="submit">Submit</button></div>
  </form>
</body>
</html>
