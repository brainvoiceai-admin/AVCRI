{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Patient Predictions — Interactive Dashboard</title>
  
    <link rel="stylesheet" href="{% static 'css/predictor_predictor_chart.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboards_nav.css' %}">
</head>
<body>
  <!-- Include existing navbar -->
  {% include 'dashboards/nav.html' %}

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">Patient Forecasts</h1>
        <div class="controls">
          <div class="btn-group">
            <button class="btn active" data-type="daily">Daily</button>
            <!-- Add more time period buttons if needed -->
          </div>
          <button id="refresh" class="btn btn-outline">Refresh</button>
        </div>
      </div>

      <!-- Date Filters -->
      <div class="card">
        <div class="card-body">
          <div class="filters">
            <div class="filter-group">
              <span class="filter-label">From:</span>
              <input type="date" id="start-date" class="form-control">
            </div>
            <div class="filter-group">
              <span class="filter-label">To:</span>
              <input type="date" id="end-date" class="form-control">
            </div>
            <button id="apply" class="btn btn-primary">Apply</button>
            <button id="clear" class="btn btn-outline">Clear</button>
          </div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="summary">
        <div class="summary-card">
          <div class="summary-value" id="next-day">–</div>
          <div class="summary-label" id="next-day-label">Tomorrow</div>
        </div>
        <div class="summary-card">
          <div class="summary-value" id="next-week">–</div>
          <div class="summary-label">Next 7 Days</div>
        </div>
        <div class="summary-card">
          <div class="summary-value" id="next-month">–</div>
          <div class="summary-label">Next 30 Days</div>
        </div>
      </div>

      <!-- Chart Container -->
      <div class="card">
        <div class="card-body">
          <div class="range-label" id="range-label"></div>
          <div class="chart-container">
            <canvas id="predChart"></canvas>
          </div>
          <div class="chart-meta" id="meta"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  
    <script src="{% static 'js/predictor_predictor_chart.js' %}"></script>
    <script src="{% static 'js/dashboards_nav.js' %}"></script>
</body>
</html>
