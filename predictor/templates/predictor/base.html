<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}AVCRI Dashboard{% endblock %}</title>

  <style>
    :root{
      --green-dark: #22543d;
      --green-mid: #2d6a4f;
      --green-light: #95d5b2;
      --bg: #f4fdf6;
      --card-bg: #ffffff;
      --muted: #1b4332;
    }
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--muted);
    }
    header{
      background: linear-gradient(90deg,var(--green-mid),var(--green-dark));
      color:#fff;
      padding:12px 20px;
      display:flex;
      align-items:center;
      gap:18px;
    }
    header a.logo{
      font-weight:700;
      color:#fff;
      text-decoration:none;
      font-size:18px;
    }
    nav a{
      color: rgba(255,255,255,0.9);
      text-decoration:none;
      margin-right:12px;
      font-size:14px;
    }
    main { padding:18px; max-width:1200px; margin:18px auto; }
    .card{ background:var(--card-bg); border-radius:10px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,0.06);}
    footer { color:#666; text-align:center; padding:18px 6px; font-size:13px; }
  </style>

  {% block head_extra %}{% endblock %}
</head>
<body>
  <header>
    <a class="logo" href="/">AVCRI</a>
    <nav>
      <a href="/predictor/dashboard/">Predictions</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
  &copy; {% now "Y" %} AVCRI — Patient Forecasts
</footer>


  {% block scripts %}{% endblock %}
</body>
</html>
